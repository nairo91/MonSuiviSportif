name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/irontrack_test?sslmode=disable
  SESSION_SECRET: ci-secret-0123456789abcdef0123456789abcdef

jobs:
  quality:
    name: Typecheck, lint & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Tests unitaires (couverture)
        run: npm run test:coverage

  e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irontrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Installer Chromium Playwright
        run: npx playwright install chromium --with-deps
      - name: Tests E2E
        run: npx playwright test
      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
